services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cicd-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/cicd_api
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:8
    container_name: cicd-mongodb
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mongodb_data:
