apiVersion: v1
kind: Pod
spec:
  containers:
    - name: trivy
      image: aquasec/trivy:0.75.0
      command:
        - /bin/sh
      args:
        - -c
        - while true; do sleep 3600; done
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          memory: 1Gi

    - name: node
      image: node:22
      command:
        - cat
      tty: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi

    - name: kaniko
      image: ghcr.io/osscontainertools/kaniko:debug
      command:
        - /busybox/sh
      args:
        - -c
        - while true; do sleep 3600; done
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          memory: 2Gi
