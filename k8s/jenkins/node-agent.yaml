apiVersion: v1
kind: Pod
metadata:
  labels:
    app: jenkins-agent
spec:
  containers:
    - name: node
      image: node:20-alpine
      command: ["sleep", "99d"]
      resources:
        requests:
          cpu: "200m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "512Mi"

    - name: kaniko
      image: gcr.io/kaniko-project/executor:debug
      command: ["tail", "-f", "/dev/null"]
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "2"
          memory: "3Gi"

    - name: trivy
      image: aquasec/trivy:latest
      command: ["tail", "-f", "/dev/null"]
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "2"
          memory: "3Gi"
